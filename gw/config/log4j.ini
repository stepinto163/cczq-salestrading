#log4j.rootLogger=DEBUG,file
log4j.rootLogger=info,stdout
#log4j.logger.ats.foundation.utils.aq=ERROR,stdout
log4j.logger.org.apache.zookeeper=INFO,stdout

log4j.appender.file=ats.foundation.utils.logger.MDTDailyRollingFileAppender
log4j.appender.file.File=../../log/GW
log4j.appender.file.DatePattern='_'yyyyMMdd'.log'
log4j.appender.file.Append=true
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=%d{yyyy/MM/dd HH:mm:ss.SSS} %p %m (%C{1}:%L)%n
log4j.appender.monitorAppender.BufferedIO=true 
log4j.appender.monitorAppender.BufferSize=8192 


log4j.appender.stdout=org.apache.log4j.ConsoleAppender  
log4j.appender.stdout.Target=System.out
log4j.appender.stdout.follow = true
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout  
log4j.appender.stdout.layout.ConversionPattern=%d{ABSOLUTE} %5p - %m (%C{1}:%L)%n

 
