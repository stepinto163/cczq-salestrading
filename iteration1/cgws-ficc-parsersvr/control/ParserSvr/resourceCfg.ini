[DBPoolResource]
dbpool.cfg=${env:ATS_ROOT}/control/DBPoolConfig.ini
dbpool.default=MYSQL0

[NetServerResource]
ceda.server.userMonitor=false
permitCheck=true
serverKey=SERVER.ParserSvr
threadCount=4
threadMaxCount=10
msgDeliverCount=2

handlerList=BondParserHandler,IRSParserHandler,VirtualParserHandler,ImageParserHandler,DealParserHandler
handler.BondParserHandler.topic=stc.parser.bond
handler.BondParserHandler.class=sc.app.stc.parser.handler.BondParserHandler
handler.IRSParserHandler.topic=stc.parser.irs
handler.IRSParserHandler.class=sc.app.stc.parser.handler.IRSParserHandler
handler.VirtualParserHandler.topic=stc.parser.virtual
handler.VirtualParserHandler.class=sc.app.stc.parser.handler.VirtualParserHandler
handler.ImageParserHandler.topic=stc.parser.image
handler.ImageParserHandler.class=sc.app.stc.parser.handler.ImageParserHandler
handler.DealParserHandler.topic=stc.parser.trade
handler.DealParserHandler.class=sc.app.stc.parser.handler.DealParserHandler
