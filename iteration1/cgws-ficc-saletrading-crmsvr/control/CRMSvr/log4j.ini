log4j.rootLogger=INFO,stdout,startupFile
log4j.logger.ficc.startup=INFO,stdout,startupFile
log4j.additivity.ficc.startup=false
log4j.appender.startupFile=org.apache.log4j.RollingFileAppender
log4j.appender.startupFile.File=logs/startup.log
log4j.appender.startupFile.MaxFileSize=5MB
log4j.appender.startupFile.MaxBackupIndex=3
log4j.appender.startupFile.Encoding=UTF-8
log4j.appender.startupFile.layout=org.apache.log4j.PatternLayout
log4j.appender.startupFile.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%t] %c - %m%n
log4j.logger.ficc.crm=INFO
log4j.logger.ficc.crm.dps=DEBUG
log4j.logger.ficc.common.client.NetClientTransport=DEBUG
log4j.logger.ficc.common=INFO
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=%d{HH:mm:ss} %-5p %c - %m%n
