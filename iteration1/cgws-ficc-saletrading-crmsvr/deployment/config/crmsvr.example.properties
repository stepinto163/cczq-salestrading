# Deployment-local CRM connection for CRMSvr.
# Copy to config/crmsvr.local.properties and fill in the read-only account.
# This file holds credentials: keep it out of Git, Jenkins templates and the service package.
crm.jdbcUrl=jdbc:postgresql://<host>:<port>/ficc_ibor
crm.schema=public
crm.username=<read-only CRM account>
# Tag values CRMSvrClient filters on (sc.app.stc.utils.Consts): an institution whose taglist
# misses InstTagList ("BOND,NCD") and a trader whose biztype misses ContactBizType
# ("BNC,BCO,ABS,NCD") are dropped by the consumer. Keep them aligned with the consumer build.
crm.stc.instTagList=BOND
crm.stc.contactBizType=BNC
# Preferred: name of the environment variable holding the password.
crm.passwordEnv=FICC_CRM_PASSWORD
# Alternatively omit crm.passwordEnv and set crm.password here in the deployment-local file only.
# crm.password=
