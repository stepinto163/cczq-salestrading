# Shared FIX/intake credentials are supplied by the existing ATS_ROOT/control environment.
secrets.file=$ATS_ROOT/control/QtIntakeSvrAuth.properties
fix.settings=./config/qtrade-fix.cfg
fix.charset=UTF-8
fix.replayOnStartup=false
inbox.path=./data/inbox
inbox.capacity=10000
quote.timeoutMillis=3000

