# Copy and fill credentials under ATS_ROOT/control; do not commit credentials.
secrets.file=$ATS_ROOT/control/QtIntakeSvrAuth.properties
fix.settings=./config/qtrade-fix.cfg
fix.charset=UTF-8
fix.replayOnStartup=false
inbox.path=./data/inbox
inbox.capacity=10000
quote.timeoutMillis=3000

# QTrade account -> STC userid mapping for the quote owner. STC has no QTrade account column,
# so this file is the only source for the mapping; unmapped accounts fall back to
# owner.defaultUserId. Configure at least one of the two, otherwise startup fails.
owner.mapFile=$ATS_ROOT/control/QtIntakeOwnerMap.properties
# Fallback for accounts missing from owner.mapFile; empty means reject unmapped accounts.
owner.defaultUserId=
