# STC layout: $ATS_ROOT/stc/QtIntakeSvr -> ../../log
log4j.rootLogger=INFO,stdout,file
log4j.logger.ficc.startup=INFO,stdout,file,startupFile
log4j.additivity.ficc.startup=false

# Payload DEBUG logs stay in the DPS file; INFO/errors remain visible operationally.
log4j.logger.ficc.common.client.NetClientTransport=DEBUG,stdout,file,dpsMessages
log4j.additivity.ficc.common.client.NetClientTransport=false
log4j.logger.ficc.common.client.StcBaseSvrClientBridge=DEBUG,stdout,file,dpsMessages
log4j.additivity.ficc.common.client.StcBaseSvrClientBridge=false
log4j.logger.ficc.common.client.PostgresCrmClient=DEBUG,stdout,file,dpsMessages
log4j.additivity.ficc.common.client.PostgresCrmClient=false
log4j.logger.com.gw.common.utils.GwServerResource=INFO
log4j.logger.sc.app.stc.net.NetRtOutputStream=WARN

log4j.appender.file=ats.foundation.utils.logger.MDTDailyRollingFileAppender
log4j.appender.file.File=../../log/QtIntakeSvr
log4j.appender.file.DatePattern='_'yyyyMMdd'.log'
log4j.appender.file.Append=true
log4j.appender.file.Threshold=INFO
log4j.appender.file.Encoding=UTF-8
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=%d{yyyy/MM/dd HH:mm:ss.SSS} %-5p [%t] %c - %m%n

log4j.appender.startupFile=ats.foundation.utils.logger.MDTDailyRollingFileAppender
log4j.appender.startupFile.File=../../log/QtIntakeSvr-startup
log4j.appender.startupFile.DatePattern='_'yyyyMMdd'.log'
log4j.appender.startupFile.Append=true
log4j.appender.startupFile.Threshold=INFO
log4j.appender.startupFile.Encoding=UTF-8
log4j.appender.startupFile.layout=org.apache.log4j.PatternLayout
log4j.appender.startupFile.layout.ConversionPattern=%d{yyyy/MM/dd HH:mm:ss.SSS} %-5p [%t] %c - %m%n

log4j.appender.dpsMessages=ats.foundation.utils.logger.MDTDailyRollingFileAppender
log4j.appender.dpsMessages.File=../../log/QtIntakeSvr-dps
log4j.appender.dpsMessages.DatePattern='_'yyyyMMdd'.log'
log4j.appender.dpsMessages.Append=true
log4j.appender.dpsMessages.Threshold=DEBUG
log4j.appender.dpsMessages.Encoding=UTF-8
log4j.appender.dpsMessages.layout=org.apache.log4j.PatternLayout
log4j.appender.dpsMessages.layout.ConversionPattern=%d{yyyy/MM/dd HH:mm:ss.SSS} %-5p [%t] %c - %m%n

log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.Target=System.out
log4j.appender.stdout.Threshold=INFO
log4j.appender.stdout.Encoding=UTF-8
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=%d{HH:mm:ss.SSS} %-5p %c - %m%n

log4j.logger.ficc.qtintake.messages=DEBUG,dpsMessages
log4j.additivity.ficc.qtintake.messages=false
