# Merge these settings into the deployment's existing adapter properties file.
crm.mode=postgresql
crm.jdbcUrl=jdbc:postgresql://<host>:<port>/ficc_ibor
crm.schema=public
crm.username=<read-only CRM account>
crm.passwordEnv=FICC_CRM_PASSWORD
# Alternatively omit crm.passwordEnv and set crm.password in a deployment-local file.
