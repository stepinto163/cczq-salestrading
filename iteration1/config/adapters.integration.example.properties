# UTF-8. QuoteSvr and NotificationSvr can reference the same deployment-local file.
identity.mode=stc
identity.serverKey=SERVER.LoginSvr
identity.requestTimeoutMillis=3000
# Preserve real STC userid; list explicit FICC grants, never username prefixes.
identity.adminUserIds=
identity.internalUserIds=
# Internal QuoteSvr synchronization does not use an end-user login or configured credentials.

base.mode=stc
base.serverKey=SERVER.BaseSvr
# Timeout for the adapter's additional stc.base.search request; SDK lookups use STC settings.
base.requestTimeoutMillis=3000
# Uses the installed BaseSvrClient in request mode, delegating to BaseSvr2Client.
# Exact bond IDs are loaded on demand. STC owns caching, timeout and invalidation.
# Old base.securityIds/pageSize/refreshSeconds/loadTimeoutSeconds settings are unused.
# STC TSmallView supplies RATE/CREDIT classification. Optional business overrides:
# base.market.250001.IB=RATE
# base.marketBySubtype.<actual-STC-Bond_Subtype>=RATE or CREDIT
# base.issuerType.<actual-STC-issuer_type>=GOVERNMENT / POLICY_BANK / CORPORATE ...

# No CRM data until the internal team supplies its adapter.
crm.mode=empty
# crm.mode=custom
# crm.adapterClass=cczq.salestrading.crm.InternalCrmClient
# crm.adapterJar=D:/services/ficc/extensions/cczq-salestrading-crm-adapter-0.1.0-SNAPSHOT.jar
# crm.serverKey=SERVER.CrmSvr
# Prototype only: fill unavailable external filter attributes with marked synthetic values.
# Keep false for real-data acceptance. Values are marked in filterDataSources.
base.filter.simulateMissing=false
