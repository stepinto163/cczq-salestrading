# Merge into the appropriate service's ATSConfig.ini.
# REGISTER.<key>.Host must identify the internal ZooKeeper ensemble.
#
# QA (ZooKeeper 10.130.21.53:2181) naming convention, verified 2026-09-14:
#   The LoginSvr process registers in ZooKeeper under the node name
#   "ValidationServer" — every stc-lite service uses
#   SERVER.LoginSvr.ServiceName=ValidationServer. There is no
#   /MDTService/LoginSvr node. Verified registrations:
#     /MDTService/ValidationServer -> Host:10.130.21.53,Port:20040,Stat:1
#     /MDTService/BaseSvr          -> Host:10.130.21.53,Port:20041,Stat:1
SERVER.LoginSvr.Name=LoginSvr
SERVER.LoginSvr.ServiceName=ValidationServer
SERVER.LoginSvr.Host=127.0.0.1:1
SERVER.LoginSvr.RegisterEnable=1
SERVER.LoginSvr.RegType=1
SERVER.LoginSvr.RegisterServerList=REGISTER.Svr1
SERVER.LoginSvr.LBFactor=1

SERVER.BaseSvr.Name=BaseSvr
SERVER.BaseSvr.ServiceName=BaseSvr
SERVER.BaseSvr.Host=127.0.0.1:1
SERVER.BaseSvr.RegisterEnable=1
SERVER.BaseSvr.RegType=1
SERVER.BaseSvr.RegisterServerList=REGISTER.Svr1
SERVER.BaseSvr.LBFactor=1
