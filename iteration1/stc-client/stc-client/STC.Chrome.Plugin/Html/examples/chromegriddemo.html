    <script type="text/javascript">
        var bidofrconvert = function (val) {
            if (val == "0") {
                return '<span style="color: #FF7D00">' + 'Bid' + '</span>';
            }
            return '<span style="color: 009AFF">' + 'Ofr' + '</span>';
        }
        //列
        var bidcols = [
            { title: '来源', name: 'Source', width: 60, align: 'left' },
            { title: 'IsMe', name: 'IsMe', width: 40, align: 'left' },
            { title: '有效', name: 'IsPermission', width: 40, align: 'left' },

            {
                title: '方向', name: 'Side', width: 30, align: 'center', renderer: bidofrconvert
            },
            { title: '清算方式', name: 'SettlType', width: 30, align: 'center' },
            { title: '远', name: 'SettlType_yuan', width: 60, align: 'center' },

            { title: '累计', name: 'Qty', width: 80, align: 'right', type: 'number' },
            {
                title: '价格', name: 'EntryPx', width: 60, align: 'right', type: 'number', renderer: function (val) {
                    return '<span style="color: #FF7D00">' + val + '</span>';
                }
            },
            { title: 'firm', name: 'FirmFlag', width: 40, align: 'right' },
        ];

        var ofrcols = [
            { title: 'firm', name: 'FirmFlag', width: 40, align: 'right' },
            {
                title: '价格', name: 'EntryPx', width: 60, align: 'right', type: 'number', renderer: function (val) {
                    return '<span style="color: #009AFF">' + val + '</span>';
                }
            },
            { title: '累计', name: 'Qty', width: 80, align: 'right', type: 'number' },
            { title: '远', name: 'SettlType_yuan', width: 60, align: 'center' },
            { title: '清算方式', name: 'SettlType', width: 30, align: 'center' },
            {
                title: '方向', name: 'Side', width: 30, align: 'center', renderer: function (val) {
                    return '<span style="color: #009AFF">' + 'Ofr' + '</span>';
                }
            },
            { title: '有效', name: 'IsPermission', width: 40, align: 'left' },
            { title: 'IsMe', name: 'IsMe', width: 40, align: 'left' },
            { title: '来源', name: 'Source', width: 60, align: 'left' },
        ];

        var fixed2 = function (val) {
            if (typeof val != 'number') {
                return '';
            }
            return val.toFixed(2);
        }

        //加百分号
        var fixed2percentage = function (val) {
            return fixed2(val) + '%';
        }
        //高亮
        var highliht = function (val) {
            if (val > 0) {
                return '<span style="color: #b00">' + fixed2(val) + '</span>';
            } else if (val < 0) {
                return '<span style="color: #0b0">' + fixed2(val) + '</span>';
            }
            return fixed2(val);
        };

        $(function () {
            $("#secucode").focus();

            $(document).keydown(function (e) {
                if (e.keyCode == 13) {
                    $("#btnSearch").click();
                }
            });

            //js 打开 c# 行情小窗
            $("#btnSearch").click(function () {
                try {
                    var code = $("#secucode").val();

                    if (code == "") {
                        alert('代码不能为空');
                        $("#secucode").focus();
                        return;
                    }
                    // 调用 C# 提供的 JSON 数据
                    cef.getBonds(code).then(msg => {
                        // 调用 C# 提供的 JSON 数据
                        console.log(msg);
                        // 将数据填充到页面
                        var data = JSON.parse(msg);
                        $("#txtSymbolCode").html(data[0].Bond_ID);
                        $("#secucode").val(data[0].Bond_ID);
                        $("#txtSymbolName").html(data[0].Short_Name);
                        $("#txtRemaingingTime").html(data[0].RemaingingTime);
                        var securityId = data[0].Bond_ID;
                        cef.setBonds(securityId);
                    }).catch(error => {
                        console.error("调用失败:", error);
                    });
                } catch (error) {
                    alert(error);
                }
            });
            //js 打开 c# 行情小窗
            $("#btnOpenPriceAndOrder").click(function () {
                try {
                    var code = $("#secucode").val();

                    if (code == "") {
                        alert('代码不能为空');
                        $("#secucode").focus();
                        return;
                    }

                    //调用C#后台方法
                    cef.pubClient("priceWin", code)
                        .then(function (res) {
                            //c#方法返回消息
                            console.log(msg);
                        });

                } catch (error) {
                    alert(error);
                }
            });
            //本地示例
            $('#bidgrid').mmGrid({
                cols: bidcols,
                height: 500,
            });

            //本地示例
            $('#ofrgrid').mmGrid({
                cols: ofrcols,
                height: 500,
            });
        });


        // 接收C#调用JS监听
        function MG_CallBack(obj) {
            var data = eval('(' + obj + ')');
            if (data.jsonData == null || data.jsonData === 'null' || data.jsonData === '' || data.jsonData === undefined || data.jsonData === 'undefined' || data.jsonData === 'unknown') {
                return;
            }

            // $.zxxbox.remind(obj, null, { drag: true });

            // 如果不是Bid行情，则过滤掉
            if (data.tableName == 'BidQuotations') {
                var mmg = $('#bidgrid').mmGrid();
                mmg.load(data.jsonData);
            }
            else if (data.tableName == 'OfrQuotations') {
                var mmg2 = $('#ofrgrid').mmGrid();
                mmg2.load(data.jsonData);
            }
            // 返回 c# 调用结果
            return "Ok";
        }
