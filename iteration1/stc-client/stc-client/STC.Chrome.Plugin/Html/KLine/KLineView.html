	function MG_Call(obj) {
		// var data = eval('(' + obj + ')');
		// if (data.jsonData == null || data.jsonData === 'null' || data.jsonData === '' || data.jsonData === undefined || data.jsonData === 'undefined' || data.jsonData === 'unknown') {
		// 	return;
		// }
		
		console.log(obj);
		var data = JSON.parse(obj);
		
		var chartDataList = data.map(function (dataObj) {
			return {
				timestamp: new Date(dataObj.FmtTime).getTime(),
				open: +dataObj.Open,
				high: +dataObj.High,
				low: +dataObj.Low,
				close: +dataObj.Close,
				volume: Math.ceil(+dataObj.Volume),
			}
		})
		
		
		kline.applyNewData(chartDataList);
	}
	
	function OnKLineData(obj) {
		console.log(obj)
		
		var data = JSON.parse(obj)
		
		kline.updateData(function (data) {
			return {
				timestamp: new Date(data.FmtTime).getTime(),
				open: +data.Open,
				high: +data.High,
				low: +data.Low,
				close: +data.Close,
				volume: Math.ceil(+data.Volume),
			}
		})
	}
	
	function ResetSize() {
		console.log('resetSize start')
		kline.resize()
		console.log('resetSize end')
	}
	
	function OnLineClick() {
		ChangeLineStyle('line')
	}
	
	function OnCandle1mClick() {
			ChangeLineStyle('candle_solid', '1M')
	}
	
	function OnCandle5mClick() {
			ChangeLineStyle('candle_solid', '5M')
	}
	
	function OnCandle30mClick() {
			ChangeLineStyle('candle_solid', '30M')
	}
	
	function OnCandle1HClick() {
			ChangeLineStyle('candle_solid', '1H')
	}
	
	function OnCandle1DClick() {
			ChangeLineStyle('candle_solid', '1D')
	}
	
	function ChangeLineStyle(options, timeType) {
		console.log(options)
		console.log(timeType)
		
		if (options == 'line') {
			kline.setStyleOptions({
			  candle: {
				type: 'area',
			  },
			});
		} else if (options == 'candle_solid') {
			kline.setStyleOptions({
			  candle: {
				type: 'candle_solid',
			  },
			});
			
			if (timeType == '1M') {
				cefJS.changeKLineData('1M')
			} else if (timeType == '5M') {
				cefJS.changeKLineData('5M')
			} else if (timeType == '30M') {
				cefJS.changeKLineData('30M')
			} else if (timeType == '1H') {
				cefJS.changeKLineData('1H')
			} else if (timeType == '1D') {
				cefJS.changeKLineData('1D')
		    }
		}
	}
