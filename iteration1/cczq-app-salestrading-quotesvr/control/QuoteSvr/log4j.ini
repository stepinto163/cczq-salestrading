log4j.rootLogger=WARN,stdout
log4j.logger.ficc.startup=INFO,stdout,startupFile
log4j.additivity.ficc.startup=false
log4j.appender.startupFile=org.apache.log4j.RollingFileAppender
log4j.appender.startupFile.File=logs/startup.log
log4j.appender.startupFile.MaxFileSize=5MB
log4j.appender.startupFile.MaxBackupIndex=3
log4j.appender.startupFile.Encoding=UTF-8
log4j.appender.startupFile.layout=org.apache.log4j.PatternLayout
log4j.appender.startupFile.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%t] %c - %m%n
log4j.logger.ficc.quote=INFO
log4j.logger.ficc.common=INFO,dpsMessages
log4j.logger.ficc.common.client.NetClientTransport=DEBUG
log4j.logger.ficc.common.client.StcBaseSvrClientBridge=DEBUG
log4j.logger.ficc.common.client.PostgresCrmClient=DEBUG
log4j.additivity.ficc.common=false
log4j.appender.dpsMessages=org.apache.log4j.RollingFileAppender
log4j.appender.dpsMessages.File=logs/dps-messages.log
log4j.appender.dpsMessages.MaxFileSize=10MB
log4j.appender.dpsMessages.MaxBackupIndex=3
log4j.appender.dpsMessages.Encoding=UTF-8
log4j.appender.dpsMessages.layout=org.apache.log4j.PatternLayout
log4j.appender.dpsMessages.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%t] %c - %m%n
log4j.logger.com.gw.common.utils.GwServerResource=INFO
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=%d{HH:mm:ss} %-5p %c - %m%n
