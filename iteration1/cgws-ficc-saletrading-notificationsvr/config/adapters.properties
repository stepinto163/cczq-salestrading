identity.mode=stc
identity.serverKey=SERVER.LoginSvr
identity.requestTimeoutMillis=3000
base.mode=stc
base.serverKey=SERVER.BaseSvr
# Reuse one mapped security record across the many lookups a single quote/snapshot
# request makes. STC still owns loading and invalidation; 0 disables the memo so every
# STC update is visible immediately.
base.securityCacheTtlMillis=30000
# BaseSvr2Client only caches info-table hits, so an absent key is re-requested over the
# wire every time. Remember the miss instead; 0 disables.
base.emptyInfoTableTtlMillis=60000
# CRM is served by CRMSvr over the STC bus; CRMSvr is the only service that reads crm_*.
# Fall back to the direct database path with crm.mode=postgresql + crm.sourceName=FICC_CRM.
crm.mode=stc
crm.serverKey=SERVER.CRMSvr
crm.requestTimeoutMillis=3000
